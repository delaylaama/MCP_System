version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mcp_file_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcp_file_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: mcp_file_server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - LOCAL_STORAGE_ROOT=/app/local_storage
    volumes:
      - ./local_storage:/app/local_storage
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mcp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/mcp_file_manager
      - MCP_SERVER_URL=http://mcp-server:8001/mcp
      - FRONTEND_URL=http://localhost:5173
      - LOCAL_STORAGE_ROOT=/app/local_storage
    volumes:
      - ./local_storage:/app/local_storage
      - ./chroma_db:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mcp_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
